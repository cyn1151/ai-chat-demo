<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .chat-box {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .chat-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .messages {
      height: 420px;
      overflow-y: auto;
      padding: 20px;
      background: #f9fafb;
    }

    .message {
      display: flex;
      margin-bottom: 16px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
    }

    .message.user .bubble {
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .message.bot .bubble {
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 6px;
    }

    .input-area {
      display: flex;
      gap: 12px;
      padding: 18px 20px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
    }

    input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button {
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: #fff;
      padding: 0 22px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="chat-box">
      <div class="chat-header">AI 聊天助手</div>
      <div class="messages" id="messages">
        <div class="message bot">
          <div class="bubble">你好！我是 AI 助手，有什么可以帮你？</div>
        </div>
      </div>
      <div class="input-area">
        <input type="text" id="userInput" placeholder="输入消息..." />
        <button type="button" id="sendBtn">发送</button>
      </div>
    </div>
  </div>
</body>
<script>

  // 用SSE EventSource来接收流式数据
  // const es = new EventSource('http://localhost:3000/stream')
  // es.onmessage=(event)=>{
  //     if(event.data==='[DONE]'){
  //         console.log('Stream end')
  //         es.close()
  //         return
  //     }
  //     console.log('Received:', event.data)
  // }

  //用fetch + ReadableStream来接收流式数据
  async function fetchStream() {
    const response = await fetch('http://localhost:3000/stream')
    const reader = response.body.getReader()
    const decoder = new TextDecoder('utf-8')
    while (true) {
      const { done, value } = await reader.read()
      if (done) {
        console.log('Stream finished')
        break
      }
      const chunk = decoder.decode(value)
      console.log('Received chunk:', chunk.replace('data:', ''))
    }
  }
  fetchStream()


</script>

</html>
